name: Washing machine monitor (Rust)
on:
  pull_request:
    paths:
      - rust/**
      - recognise/display_template.png
      - recognise/template_bar.jpg
      - .github/workflows/monitor.yml
  push:
    branches:
      - master
    paths:
      - rust/**
      - recognise/display_template.png
      - recognise/template_bar.jpg
      - .github/workflows/monitor.yml
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libopencv-dev clang libclang-dev
          rustup component add clippy rustfmt
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --locked

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/monitor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
