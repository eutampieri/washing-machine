[package]
name = "washing-machine-monitor"
version = "0.1.0"
edition = "2021"
description = "Reads a washing machine's panel from an RTSP camera and publishes its state to Home Assistant over MQTT"
license = "MIT"
publish = false

# Standalone workspace, so the crate (and its Cargo.lock) builds on its own,
# independently from the tools in the repository root workspace.
[workspace]

[dependencies]
anyhow = "1.0.104"
ctrlc = { version = "3.4", features = ["termination"] }
env_logger = "0.11.11"
humantime = "2.4.0"
log = "0.4.35"
opencv = { version = "0.102.0", default-features = false, features = ["calib3d", "features2d", "flann", "imgcodecs", "imgproc", "videoio"] }
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
